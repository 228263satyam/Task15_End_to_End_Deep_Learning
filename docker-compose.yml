services:
  backend:
    build:
      context: ./backend
    container_name: task15-cifar10-api
    ports:
      - "5000:5000"
    environment:
      MODEL_PATH: /app/model/cifar10_model.keras
      NORMALIZE_INPUT: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: task15-cifar10-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
