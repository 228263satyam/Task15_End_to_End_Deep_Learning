apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-backend
  namespace: task15-cifar10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cifar10-backend
  template:
    metadata:
      labels:
        app: cifar10-backend
    spec:
      containers:
        - name: api
          image: task15-cifar10-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MODEL_PATH
              value: /app/model/cifar10_model.keras
            - name: NORMALIZE_INPUT
              value: "0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cifar10-backend
  namespace: task15-cifar10
spec:
  selector:
    app: cifar10-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
